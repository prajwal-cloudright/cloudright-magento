services:
  magento:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cloudright-magento
    ports:
      - "8080:80"

    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy

    environment:
      TZ: Asia/Kolkata

    volumes:
      # CloudRight Payments module
      - ./app/code/CloudRight/Payments:/var/www/html/app/code/CloudRight/Payments

      # CloudRight Custom frontend theme
      - ./app/design/frontend/CloudRight/Custom:/var/www/html/app/design/frontend/CloudRight/Custom

  cron:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cloudright-magento-cron

    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy

    environment:
      TZ: Asia/Kolkata

    volumes:
      # CloudRight Payments module
      - ./app/code/CloudRight/Payments:/var/www/html/app/code/CloudRight/Payments

      # CloudRight Custom frontend theme
      - ./app/design/frontend/CloudRight/Custom:/var/www/html/app/design/frontend/CloudRight/Custom

    command: >
      bash -c
      "while true;
      do
        php bin/magento cron:run;
        sleep 60;
      done"

  mysql:
    image: mysql:8.4
    container_name: cloudright-magento-mysql

    environment:
      MYSQL_ROOT_PASSWORD: magento_root_password
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento_password

    command: --log-bin-trust-function-creators=1

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-pmagento_root_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.4
    container_name: cloudright-magento-opensearch

    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - opensearch_data:/usr/share/opensearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  opensearch_data:
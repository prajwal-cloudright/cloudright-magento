name: Build and Deploy Magento

on:
  push:
    branches:
      - cloudright-magento

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 611990273456.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: cloudright-magento
  EC2_INSTANCE_ID: i-0e6cba943ff97a117

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to EC2
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CloudRight Magento deployment ${GITHUB_SHA}" \
            --parameters "commands=[\"sudo chown 33:33 /opt/cloudright-magento/config/config.php && sudo /opt/cloudright-magento/deploy.sh ${GITHUB_SHA}\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for EC2 deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          echo "Waiting for EC2 deployment to finish..."
          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "EC2 deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "EC2 deployment finished with status: $STATUS"
                exit 1
                ;;
              Pending|InProgress|Delayed)
                echo "Deployment still running. Waiting 15 seconds..."
                sleep 15
                ;;
              *)
                echo "Unknown deployment status: $STATUS"
                sleep 15
                ;;
            esac
          done

          echo "EC2 deployment did not finish within 15 minutes."
          exit 1

      - name: Show deployment result
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
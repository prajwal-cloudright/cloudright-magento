name: Build and Deploy Magento

on:
  push:
    branches:
      - cloudright-magento

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 611990273456.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: cloudright-magento
  EC2_INSTANCE_ID: i-0e6cba943ff97a117

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inspect EC2 deploy script
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Inspect Magento deploy script" \
            --parameters "commands=[\"echo '=============================================='; echo ' CURRENT CONFIG.PHP MOUNT'; echo '=============================================='; sudo grep -n -A3 -B3 'config.php' /opt/cloudright-magento/deploy.sh\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for EC2 inspection
        continue-on-error: true
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Show EC2 inspection result
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json